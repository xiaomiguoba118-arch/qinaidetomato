<title>亲爱的番茄 · 点菜小程序</title>
<style>
:root{
  --paper:#F7F3E8;
  --paper2:#FBF8F0;
  --ink:#241D17;
  --ink2:#5D5247;
  --muted:#9A8E7E;
  --red:#DB4A2E;
  --red2:#B5341F;
  --green:#6E9B52;
  --green2:#4F7539;
  --line:#D9D0BE;
  --grid:rgba(190,178,155,.22);
  --desk:#E8E1D2;
  --hand:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body[data-theme="mint"]{
  --paper:#E9F2E6; --paper2:#F4FAF2; --desk:#D8E4D4;
  --grid:rgba(110,155,105,.22); --muted:#7C8F77; --ink2:#4A5545;
}
body[data-theme="peach"]{
  --paper:#FBEDE4; --paper2:#FEF7F2; --desk:#F0DCD0;
  --grid:rgba(200,150,130,.22); --muted:#A08576; --ink2:#6A4E42;
}
body[data-theme="sky"]{
  --paper:#E8F0F6; --paper2:#F4F9FD; --desk:#D6E2EC;
  --grid:rgba(120,150,180,.22); --muted:#7C8C9B; --ink2:#46535F;
}
html,body{margin:0;height:100%;background:var(--desk);font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:stretch}

#app{
  position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;
  background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px, 26px 26px;
  box-shadow:0 0 60px rgba(60,45,30,.22);
  display:flex;flex-direction:column;
}
@media (min-width:500px){ #app{height:calc(100dvh - 32px);margin:16px 0;border-radius:22px} }

/* ---------- 通用 ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:transparent}
.topbar{
  flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 8px;
}
.topbar .back{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper2);
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:2px 2px 0 rgba(36,29,23,.85);color:var(--ink);
}
.topbar .back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(36,29,23,.85)}
.title{font-family:var(--hand);font-size:24px;font-weight:700;letter-spacing:1px}
.spacer{flex:1}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 108px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

.rolechip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:2px solid var(--ink);background:var(--paper2);font-size:12.5px;font-weight:700;cursor:pointer;
  box-shadow:2px 2px 0 rgba(36,29,23,.85);white-space:nowrap;
}
.rolechip .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.rolechip.chef .dot{background:var(--green)}

/* ---------- 首页 ---------- */
.brand{padding:18px 16px 4px}
.brand h1{font-family:var(--hand);font-size:30px;margin:0;letter-spacing:2px}
.brand p{margin:4px 0 0;font-size:12px;color:var(--muted);letter-spacing:1px}

.statbar{display:flex;gap:8px;padding:10px 16px 4px}
.stat{
  flex:1;background:var(--paper2);border:2px solid var(--ink);border-radius:6px;
  padding:8px 10px;box-shadow:2px 2px 0 rgba(36,29,23,.85);
}
.stat b{font-family:var(--hand);font-size:20px;display:block;line-height:1.1}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:1px}

.recent{padding:14px 16px 2px}
.recent .lb{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.recent .row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:6px}
.recent .row::-webkit-scrollbar{display:none}
.chip{
  flex:none;line-height:1.2;padding:7px 13px;border-radius:999px;border:2px solid var(--ink);background:var(--paper2);
  font-family:var(--hand);font-size:14px;cursor:pointer;box-shadow:2px 2px 0 rgba(36,29,23,.8);
  white-space:nowrap;
}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(36,29,23,.8)}
.chip.empty{color:var(--muted);border-style:dashed;box-shadow:none;cursor:default}

.vine{position:relative;padding:16px 0 20px}
.vine::before{
  content:"";position:absolute;left:54px;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(to bottom,var(--green2) 0 9px,transparent 9px 17px);
  opacity:.55;border-radius:3px;
}
.catrow{
  position:relative;display:flex;align-items:center;gap:16px;padding:12px 0 12px 8px;cursor:pointer;
}
.catrow:active .catname{transform:translateX(2px)}
.cattom{width:74px;flex:none;filter:drop-shadow(2px 3px 0 rgba(36,29,23,.18))}
.catmeta{flex:1;min-width:0}
.catname{font-family:var(--hand);font-size:34px;line-height:1.05;font-weight:700;transition:transform .12s}
.catsub{font-size:11.5px;color:var(--muted);letter-spacing:2px;margin-top:2px}
.catcount{font-size:12px;color:var(--ink2);margin-top:6px}
.catgo{font-size:20px;color:var(--ink);opacity:.45}

/* ---------- 菜品 ---------- */
.dishlist{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.dishmain{flex:1;min-width:0}
.dishname{font-family:var(--hand);font-size:19px;font-weight:700;line-height:1.25}
.dishing{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.dishfoot{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.cost{font-family:var(--hand);font-size:15px;color:var(--red2)}
.tag{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1.5px solid var(--ink);letter-spacing:.5px}
.tag.ok{background:#EAF3E1;border-color:var(--green2);color:var(--green2)}
.tag.lack{background:#FBEAE5;border-color:var(--red2);color:var(--red2)}
.tag.off{background:#EFEAE0;color:var(--muted);border-color:var(--muted)}
.rstock{
  flex:none;font-size:10.5px;padding:3px 9px;border-radius:999px;border:1.5px solid var(--red2);
  color:var(--red2);background:#FBEAE5;cursor:pointer;align-self:center;
}
.rstock:active{background:#F6D8D0}

/* ---------- 详情 ---------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 14px}
.hero .tom{width:132px;filter:drop-shadow(3px 4px 0 rgba(36,29,23,.18))}
.hero h2{font-family:var(--hand);font-size:30px;margin:10px 0 2px;letter-spacing:1px;text-align:center}
.hero .sub{font-size:12px;color:var(--muted);letter-spacing:1px}
.panel{
  background:var(--paper2);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;
  box-shadow:3px 3px 0 rgba(36,29,23,.85);margin-bottom:12px;
}
.panel h3{font-family:var(--hand);font-size:16px;margin:0 0 8px;letter-spacing:1px}
.ingrow{display:flex;flex-wrap:wrap;gap:6px}
.ing{font-size:12px;padding:3px 9px;border-radius:999px;border:1.5px solid var(--ink);background:#fff}
.ing.miss{border-color:var(--red2);color:var(--red2);background:#FBEAE5;text-decoration:line-through}
.steps{margin:0;padding-left:18px;font-size:13px;line-height:1.75;color:var(--ink2)}
.steps li{margin-bottom:2px}

.btn{
  display:block;width:100%;padding:14px;border-radius:10px;border:2px solid var(--ink);
  background:var(--red);color:#fff;font-family:var(--hand);font-size:19px;letter-spacing:2px;
  box-shadow:3px 3px 0 rgba(36,29,23,.9);cursor:pointer;font-weight:700;
}
.btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(36,29,23,.9)}
.btn.ghost{background:var(--paper2);color:var(--ink)}
.btn:disabled{background:#D8D0C2;color:#fff;border-color:#B8AE9E;box-shadow:2px 2px 0 rgba(36,29,23,.4);cursor:not-allowed}
.btn.small{padding:9px 14px;font-size:14px;width:auto;display:inline-block;letter-spacing:1px}
.btnrow{display:flex;gap:10px;margin-top:4px}
.btnrow .btn{margin:0}

/* ---------- 表单 ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;letter-spacing:1.5px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 12px;border-radius:8px;border:2px solid var(--ink);background:#fff;
  font-family:var(--sans);font-size:14px;color:var(--ink);outline:none;
}
.field textarea{min-height:96px;line-height:1.6;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red)}
.airow{display:flex;gap:8px}
.airow input{flex:1}
.aibtn{
  flex:none;padding:0 14px;border-radius:8px;border:2px solid var(--green2);background:#EAF3E1;
  color:var(--green2);font-weight:700;font-size:12.5px;cursor:pointer;letter-spacing:1px;white-space:nowrap;
}
.aibtn:active{background:#DDEBD0}
.hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(251,248,240,.96);
  border-top:2px solid var(--ink);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;padding:11px 0 13px;text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:1px;cursor:pointer}
.tab .ic{display:block;font-size:19px;line-height:1.2;filter:grayscale(1);opacity:.55}
.tab.on{color:var(--ink);font-weight:700}
.tab.on .ic{filter:none;opacity:1}

/* ---------- 厨师 ---------- */

<script>
(function(){
'use strict';

/* =========================================================
   0. 工具
   ========================================================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const root = $('#root');
const toastEl = $('#toast');
const modalEl = $('#modal');
const KEY = 'tomato_menu_v1';

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');

/* 删除标记：云端合并时用它把条目真正删掉，否则会被对方的旧数据「复活」 */
function tombstone(id){
  if (!S.tombstones) S.tombstones = [];
  if (id && S.tombstones.indexOf(id) < 0) S.tombstones.push(id);
}
const fmtTime = ts => { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const fmtDay = ts => { const d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };

/* =========================================================
   1. 音效（清脆短促，纯合成）
   ========================================================= */
let AC = null;
function initAudio(){
  if (AC) return;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  try { AC = new C(); } catch(e){}
}
function sfx(kind){
  if (!AC) return;
  const t = AC.currentTime + 0.001;
  if (kind === 'love'){
    [0, 7, 12].forEach(function(semi, i){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      const f = 660 * Math.pow(2, semi / 12);
      o.frequency.setValueAtTime(f, t + i * 0.06);
      g.gain.setValueAtTime(0.0001, t + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.1, t + i * 0.06 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.7);
      o.connect(g); g.connect(AC.destination);
      o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.75);
    });
    return;
  }

  if (kind === 'meow'){
    const mo = AC.createOscillator(), mg = AC.createGain();
    mo.type = 'sine';
    mo.frequency.setValueAtTime(700, t);
    mo.frequency.linearRampToValueAtTime(1080, t + 0.08);
    mo.frequency.linearRampToValueAtTime(820, t + 0.19);
    mg.gain.setValueAtTime(0.0001, t);
    mg.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
    mg.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    mo.connect(mg); mg.connect(AC.destination);
    mo.start(t); mo.stop(t + 0.24);
    return;
  }

  const map = {
    tap:   { f: 2300, to: 2900, dur: 0.038, type: 'sine',     vol: 0.13 },
    pop:   { f: 950,  to: 1600, dur: 0.065, type: 'sine',     vol: 0.15 },
    ok:    { f: 1450, to: 2200, dur: 0.085, type: 'sine',     vol: 0.16 },
    warn:  { f: 470,  to: 350,  dur: 0.13,  type: 'triangle', vol: 0.09 }
  };
  const p = map[kind] || map.tap;
  // 主体音
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = p.type;
  o.frequency.setValueAtTime(p.f, t);
  o.frequency.exponentialRampToValueAtTime(p.to, t + p.dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(p.vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + p.dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + p.dur + 0.03);
  // 对「清脆」加一层高频泛音
  if (kind === 'tap' || kind === 'ok'){
    const o2 = AC.createOscillator(), g2 = AC.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(p.f * 1.5, t);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.028, t + 0.002);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    o2.connect(g2); g2.connect(AC.destination);

/* 合并两份数据：两边新加的都不丢，删掉的不会复活 */
function mergeState(a, b){
  if (!a) return b ? JSON.parse(JSON.stringify(b)) : null;
  if (!b) return a;
  const out = Object.assign({}, a, b);
  const union = function(x, y){
    const m = new Map();
    (x || []).forEach(function(o){ if (o && o.id != null) m.set(o.id, o); });
    (y || []).forEach(function(o){ if (o && o.id != null) m.set(o.id, o); });
    return Array.from(m.values());
  };
  ['dishes', 'orders', 'pending', 'categories'].forEach(function(k){
    out[k] = union(a[k], b[k]);
  });
  const tomb = Array.from(new Set([].concat(a.tombstones || [], b.tombstones || [])));
  out.tombstones = tomb;
  ['dishes', 'orders', 'pending', 'categories'].forEach(function(k){
    out[k] = (out[k] || []).filter(function(o){ return tomb.indexOf(o.id) < 0; });
  });
  const rmap = new Map();
  [].concat(a.records || [], b.records || []).forEach(function(r){ if (r && r.at) rmap.set(r.at, r); });
  out.records = Array.from(rmap.values()).sort(function(x, y){ return x.at - y.at; });
  out.orderCount = (out.orders || []).length;
  out.pantry = b.pantry || a.pantry || [];
  out.restock = b.restock || a.restock || [];
  out.recent = b.recent || a.recent || [];
  return out;
}

}

function schedulePush(){

function doPush(){

const MUSIC = { on: false, timer: null, step: 0, gain: null };
// 五声音阶写的一段很慢的小调子
const MELODY = [0, 3, 5, 7, 5, 3, 0, -2, 0, 3, 7, 10, 7, 5, 3, 0];
const BASS = [0, -5, 0, -5];

function musicStart(){
  if (!AC || MUSIC.on) return;
  MUSIC.on = true;
  if (!MUSIC.gain){
    MUSIC.gain = AC.createGain();
    MUSIC.gain.gain.value = 0.16;
    MUSIC.gain.connect(AC.destination);
  }
  MUSIC.step = 0;
  tick();
  MUSIC.timer = setInterval(tick, 520);
}

function musicStop(){
  MUSIC.on = false;
  clearInterval(MUSIC.timer);
  MUSIC.timer = null;
}

function tick(){
  if (!MUSIC.on || !AC) return;
  const t = AC.currentTime + 0.02;
  const semi = MELODY[MUSIC.step % MELODY.length];
  const f = 330 * Math.pow(2, semi / 12);

  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
  o.connect(g); g.connect(MUSIC.gain);
  o.start(t); o.stop(t + 1.1);

  if (MUSIC.step % 4 === 0){
    const b = 110 * Math.pow(2, BASS[(MUSIC.step / 4) % BASS.length] / 12);
    const o2 = AC.createOscillator(), g2 = AC.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(b, t);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
    o2.connect(g2); g2.connect(MUSIC.gain);
    o2.start(t); o2.stop(t + 2.1);
  }

  MUSIC.step++;
}

/* =========================================================
   6.0 手绘番茄（SVG 现场生成，每颗形状都不一样）
   ========================================================= */
function rnd(seed){
  let s = Math.floor(seed) % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

/* 六种番茄长相：圆 / 罗马(梨形) / 牛排(扁棱) / 樱桃 / 牛心 / 条纹圆 */
const VARIETY = [
  { name: '圆',   sx: 1.00, sy: 1.00, taper: 0,    lobe: 0 },
  { name: '罗马', sx: 0.80, sy: 1.12, taper: 0.24, lobe: 0 },
  { name: '牛排', sx: 1.08, sy: 0.86, taper: 0,    lobe: 0.058 },
  { name: '樱桃', sx: 0.88, sy: 0.90, taper: 0,    lobe: 0 },
  { name: '牛心', sx: 0.90, sy: 1.06, taper: 0.13, lobe: 0 },
  { name: '条纹', sx: 1.00, sy: 1.00, taper: 0,    lobe: 0.036 }
];

function blobPoints(cx, cy, rx, ry, seed, kind){
  const r = rnd(seed);
  const n = 44;
  const v = VARIETY[(kind == null ? Math.floor(r() * VARIETY.length) : kind) % VARIETY.length];

  const h = [];
  for (let i = 0; i < 3; i++){
    h.push([0.013 + r() * 0.022, 2 + Math.floor(r() * 2), r() * 6.283]);
  }
  if (v.lobe) h.push([v.lobe, 5, r() * 6.283]);

  const pts = [];
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2;
    let k = 1;
    h.forEach(function(hh){ k += hh[0] * Math.sin(hh[1] * a + hh[2]); });
    let px = cx + rx * v.sx * k * Math.cos(a);
    let py = cy + ry * v.sy * k * Math.sin(a);
    if (v.taper && Math.sin(a) > 0){
      px = cx + (px - cx) * (1 - v.taper * Math.sin(a));   // 屁股收窄
    }
    pts.push([px, py]);
  }
  return pts;
}

function smoothClosed(pts){
  const n = pts.length;
  const mid = function(a, b){ return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
  const m0 = mid(pts[n - 1], pts[0]);
  let d = 'M' + m0[0].toFixed(1) + ' ' + m0[1].toFixed(1);
  for (let i = 0; i < n; i++){
    const p = pts[i];
    const m = mid(p, pts[(i + 1) % n]);
    d += 'Q' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' ' + m[0].toFixed(1) + ' ' + m[1].toFixed(1);
  }
  return d + 'Z';
}

function sepals(cx, cy, sz, seed){
  const r = rnd(seed + 91);
  let out = '';
  for (let i = 0; i < 5; i++){
    const a = -Math.PI / 2 + (i - 2) * 0.62;
    const len = sz * (0.9 + r() * 0.32);
    const w = sz * 0.34;
    const tip = [cx + Math.cos(a) * len, cy + Math.sin(a) * len * 0.95];
    const b1 = [cx + Math.cos(a - 0.95) * w, cy + Math.sin(a - 0.95) * w];
    const b2 = [cx + Math.cos(a + 0.95) * w, cy + Math.sin(a + 0.95) * w];
    out += '<path d="M' + cx + ' ' + cy
      + ' Q' + b1[0].toFixed(1) + ' ' + b1[1].toFixed(1) + ' ' + tip[0].toFixed(1) + ' ' + tip[1].toFixed(1)
      + ' Q' + b2[0].toFixed(1) + ' ' + b2[1].toFixed(1) + ' ' + cx + ' ' + cy + 'Z"/>';
  }
  return out;
}

function tomatoArt(seed, opt){
  opt = opt || {};
  const size = opt.size || 80;
  const mode = opt.mode || 'fill';
  const body = smoothClosed(blobPoints(50, 62, 37, 34, seed, opt.kind));
  const ink = '#241D17';

  let out = '<svg class="tart" viewBox="0 0 100 106" width="' + size + '" height="' + Math.round(size * 1.06) + '">';
  out += '<path d="' + body + '" fill="' + (mode === 'fill' ? '#DB4A2E' : 'none')
    + '" stroke="' + ink + '" stroke-width="2.8" stroke-linejoin="round"/>';
  out += '<g fill="' + (mode === 'fill' ? '#6E9B52' : '#FBF8F0')
    + '" stroke="' + ink + '" stroke-width="2.1" stroke-linejoin="round">';
  out += sepals(50, 30, 19, seed);
  out += '</g>';
  out += '<path d="M50 30 C 46 18, 51 10, 58 7" fill="none" stroke="' + ink
    + '" stroke-width="2.6" stroke-linecap="round"/>';
  if (opt.char){
    const tilt = (rnd(seed + 5)() * 6 - 3).toFixed(1);
    out += '<text x="50" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#20140f"'
      + ' transform="rotate(' + tilt + ' 50 70)"'
      + ' font-family="Kaiti SC,STKaiti,KaiTi,serif">' + esc(opt.char) + '</text>';
  }
  if (opt.delay){ out = out.replace('class="tart"', 'class="tart sway" style="--d:' + opt.delay + 's"'); }
  out += '</svg>';
  return out;
}

function varietyFor(d){
  const same = S.dishes.filter(function(x){ return x.cat === d.cat; });
  let i = same.findIndex(function(x){ return x.id === d.id; });
  if (i < 0) i = 0;
  return VARIETY_IMG[i % VARIETY_IMG.length];
}

/* 蹲在藤上的猫 */
function catArt(size){
  const k = '#241D17';
  return '<svg class="cat" viewBox="0 0 100 120" width="' + size + '" height="' + Math.round(size * 1.2) + '">'
    + '<path d="M50 114 C 28 114, 23 92, 30 73 C 35 59, 44 53, 50 53 C 56 53, 65 59, 70 73 C 77 92, 72 114, 50 114Z" fill="#FBF8F0" stroke="' + k + '" stroke-width="3.2" stroke-linejoin="round"/>'
    + '<path d="M50 58 C 36 58, 27 47, 30 35 C 33 23, 42 17, 50 17 C 58 17, 67 23, 70 35 C 73 47, 64 58, 50 58Z" fill="#FBF8F0" stroke="' + k + '" stroke-width="3.2"/>'
    + '<path d="M38 26 L34 11 L49 18Z" fill="#FBF8F0" stroke="' + k + '" stroke-width="3.2" stroke-linejoin="round"/>'
    + '<path d="M62 26 L66 11 L51 18Z" fill="#FBF8F0" stroke="' + k + '" stroke-width="3.2" stroke-linejoin="round"/>'
    + '<path class="cattail" d="M70 102 C 90 98, 94 74, 85 60" fill="none" stroke="' + k + '" stroke-width="3.2" stroke-linecap="round"/>'
    + '<circle class="cateye" cx="43" cy="35" r="2.8" fill="' + k + '"/>'
    + '<circle class="cateye" cx="57" cy="35" r="2.8" fill="' + k + '"/>'

}

function viewHome(){
  const recent = S.recent.length
    ? S.recent.map(n => {
        const d = S.dishes.find(x => x.name === n);
        return d ? '<div class="chip" data-act="quickOrder" data-id="' + d.id + '">' + esc(n) + '</div>' : '';
      }).join('')
    : '<span style="font-size:12px;color:var(--muted);padding:7px 0;display:inline-block">还没点过菜，下面挑个番茄试试</span>';

  const rows = S.categories.map(function(c, i){
    const n = S.dishes.filter(function(d){ return d.cat === c.id && d.on; }).length;
    const r = rnd(4000 + i * 13);
    const tilt = (r() * 7 - 3.5).toFixed(1);
    const dx = (r() * 26 - 13).toFixed(0);
    const size = (78 + r() * 18).toFixed(0);
    return '<div class="vrow" data-act="openCat" data-id="' + c.id + '">'
      + '<div class="vtom" style="transform:translateX(' + dx + 'px) rotate(' + tilt + 'deg)">'
      +   (TOM_IMG[c.id]
          ? '<img class="vtomimg" src="' + TOM_IMG[c.id] + '" alt="" style="--d:' + -(i * 0.7).toFixed(2) + 's" />'
          : tomatoArt(1000 + i * 37, { size: Number(size), char: c.name, delay: -(i * 0.7).toFixed(2) }))
      + '</div>'
      + '<div class="vmeta">'
      +   '<div class="vsub">' + esc(c.sub || '') + '</div>'
      +   '<div class="vcount">' + n + ' 道菜</div>'
      + '</div>'
      + '</div>';
  }).join('');

  const vineBG = '<svg class="vinebg" viewBox="0 0 120 1000" preserveAspectRatio="none">'
    + '<path d="M66 -20 C 24 80, 98 150, 60 240 C 22 330, 100 400, 58 500 C 18 590, 98 660, 54 760 C 20 850, 88 930, 62 1020"'
    + ' fill="none" stroke="#4F7539" stroke-width="6" opacity="0.72" stroke-linecap="round"/>'
    + '</svg>';

  return '<div class="screen">'
    + '<div class="scroll">'
    +   '<div class="brand" style="display:flex;align-items:flex-start;gap:10px">'
    +     '<div style="flex:1"><h1>亲爱的番茄</h1><p>今天想吃点什么 · 跟我说</p></div>'

/* =========================================================
   7. 页面：分类
   ========================================================= */
function viewCat(){
  const c = catById(R.cat) || S.categories[0];
  const list = S.dishes.filter(d => d.cat === c.id && d.on);

  const cards = list.length ? list.map(function(d, i){
    const miss = missingOf(d);
    const ok = miss.length === 0;
    const r = rnd(9000 + i * 71);
    const size = Math.round(84 + r() * 40);
    const rot = (r() * 9 - 4.5).toFixed(1);
    const dx = Math.round(r() * 16);
    const gapTop = Math.round(r() * 22);
    const nameRot = (r() * 5 - 2.5).toFixed(1);
    const nameSize = Math.round(28 + r() * 9);

    return '<div class="mitem" style="margin-left:' + dx + 'px;margin-top:' + gapTop + 'px">'
      + '<div class="mart' + (ok ? '' : ' dim') + '" data-act="openDish" data-id="' + d.id + '">'
      +   '<div class="photo" style="transform:rotate(' + rot + 'deg)">'
      +     '<img class="varimg" src="' + varietyFor(d) + '" alt="" style="width:' + size + 'px" />'
      +   '</div>'
      + '</div>'
      + '<div class="mmain" data-act="orderHere" data-id="' + d.id + '">'
      +   '<div class="mname" style="font-size:' + nameSize + 'px;transform:rotate(' + nameRot + 'deg)">'
      +     esc(d.name) + '</div>'
      +   '<div class="mmeta' + (ok ? '' : ' miss') + '">'
      +     (ok ? '点一下就吃' : '缺 ' + esc(miss.join('、'))) + '</div>'
      + '</div>'
      + (ok ? '' : '<div class="mrstock" data-act="restock" data-id="' + d.id + '">催</div>')
      + '</div>';
  }).join('') : '<div class="empty">' + tomatoArt(7, { size: 70, mode: 'line' }) + '<br>这个分类还没有菜</div>';

  // 只有一道菜的分类：按你「煮」那页的样子来——一张大图 + 一个大名字
  if (list.length === 1){
    const d = list[0];
    const miss = missingOf(d);
    const ok = miss.length === 0 && d.on;
    // 整页插图（名字写在画里）
    if (DISH_FULL[d.name]){
      return '<div class="screen">'
        + topbar(c.name, { back: true })
        + '<div class="scroll">'
        +   '<div class="fullpage" data-act="orderHere" data-id="' + d.id + '">'
        +     '<img src="' + DISH_FULL[d.name] + '" alt="" />'
        +   '</div>'
        +   '<div class="solometa' + (ok ? '' : ' miss') + '" style="text-align:center">'
        +     (ok ? '点图就加购' : '缺 ' + esc(miss.join('、')))
        +   '</div>'
        +   (ok ? '<button class="btn" data-act="orderHere" data-id="' + d.id + '">就它了 · 加购</button>'
              : '<button class="btn ghost" data-act="restock" data-id="' + d.id + '">催厨师进货</button>')
        + '</div>'
        + tabbar('home')
        + '</div>';
    }

    // 有专属插图就用它；没有就用你画的那颗带字的番茄
    const own = DISH_IMG[d.name] || TOM_IMG[d.cat] || varietyFor(d);

    // 左边大图 + 右边竖排大字
    {
      const chars = d.name.split('').map(function(ch){ return '<span>' + esc(ch) + '</span>'; }).join('');
      const nameSize = d.name.length >= 5 ? 34 : (d.name.length === 4 ? 42 : 50);
      return '<div class="screen">'
        + topbar(c.name, { back: true })
        + '<div class="scroll">'
        +   '<div class="hero-solo">'
        +     '<div class="hero-art" data-act="openDish" data-id="' + d.id + '">'
        +       '<img src="' + own + '" alt="" />'
        +     '</div>'
        +     '<div class="hero-name" style="font-size:' + nameSize + 'px" data-act="orderHere" data-id="' + d.id + '">' + chars + '</div>'
        +   '</div>'
        +   '<div class="solometa' + (ok ? '' : ' miss') + '">'
        +     (ok ? '点图或字就加购' : '缺 ' + esc(miss.join('、')))
        +   '</div>'
        +   (ok ? '<button class="btn" data-act="orderHere" data-id="' + d.id + '">就它了 · 加购</button>'
              : '<button class="btn ghost" data-act="restock" data-id="' + d.id + '">催厨师进货</button>')
        + '</div>'
        + tabbar('home')
        + '</div>';
    }

    return '<div class="screen">'
      + topbar(c.name, { back: true })
      + '<div class="scroll">'
      +   '<div class="solo">'
      +     '<div class="solophoto" data-act="openDish" data-id="' + d.id + '">'
      +       '<img src="' + varietyFor(d) + '" alt="" />'
      +     '</div>'
      +     '<div class="soloname" data-act="orderHere" data-id="' + d.id + '">' + esc(d.name) + '</div>'
      +     '<div class="solometa' + (ok ? '' : ' miss') + '">'
      +       (ok ? '点名字或图案就加购' : '缺 ' + esc(miss.join('、')))
      +     '</div>'
      +     (ok ? '<button class="btn" data-act="orderHere" data-id="' + d.id + '">就它了 · 加购</button>'
            : '<button class="btn ghost" data-act="restock" data-id="' + d.id + '">催厨师进货</button>')
      +   '</div>'
      + '</div>'
      + tabbar('home')
      + '</div>';
  }

  let deco = '';
  for (let k = 0; k < 7; k++){
    const rr = rnd(500 + k * 37);
    const x = 6 + rr() * 84;
    const y = 8 + rr() * 84;
    const sz = 3 + rr() * 8;
    const red = rr() > 0.78;
    deco += '<i class="deco' + (red ? ' red' : '') + '" style="left:' + x.toFixed(1) + '%;top:'
      + y.toFixed(1) + '%;width:' + sz.toFixed(1) + 'px;height:' + sz.toFixed(1) + 'px"></i>';
  }

  return '<div class="screen">'
    + topbar(c.name, { back: true })
    + '<div class="scroll"><div class="menulist">' + deco + cards + '</div></div>'
    + tabbar('home')
    + '</div>';
}

/* =========================================================
   9. 页面：记录
   ========================================================= */
function viewRecord(){
  if (!S.records.length){
    return '<div class="screen">' + topbar('吃饭记录')
      + '<div class="scroll"><div class="empty">' + tomatoSVG(64) + '<br>还没有记录<br>点一道菜试试</div></div>'
      + tabbar('record') + '</div>';
  }
  const groups = {};
  S.records.slice().reverse().forEach(r => {
    const k = dayKey(r.at);
    (groups[k] = groups[k] || []).push(r);
  });
  const now = new Date();
  const mk = now.getFullYear() + '-' + pad2(now.getMonth() + 1);
  const monthCount = S.records.filter(function(r){ return dayKey(r.at).indexOf(mk) === 0; }).length;
  const tally = {};
  S.records.forEach(function(r){ tally[r.name] = (tally[r.name] || 0) + 1; });
  const topName = Object.keys(tally).sort(function(a, b){ return tally[b] - tally[a]; })[0];

  const statline = '<div class="recstat">'
    + '这个月 <b>' + monthCount + '</b> 顿'
    + (topName ? '　·　最常点 <b>' + esc(topName) + '</b> ' + tally[topName] + ' 次' : '')
    + '</div>';

  const html = Object.keys(groups).map(k => {
    const items = groups[k].map(r =>
      '<div class="rowcard" style="margin-bottom:8px">'
      + '<div class="rc-top"><div class="rc-name">' + esc(r.name) + '</div>'
      + '<div style="font-size:11px;color:var(--muted)">' + fmtTime(r.at) + '</div></div>'
      + '<div class="rc-sub">' + esc(r.cat || '') + '</div>'
      + '</div>'
    ).join('');
    return '<div style="margin-bottom:16px">'
      + '<div style="font-family:var(--hand);font-size:17px;margin:6px 0 8px">' + fmtDay(groups[k][0].at) + '</div>'
      + items + '</div>';
  }).join('');

  return '<div class="screen">' + topbar('吃饭记录')
    + '<div class="scroll" style="padding-top:4px">' + statline + html + '</div>'
    + tabbar('record') + '</div>';
}

/* =========================================================
   10. 页面：厨房
   ========================================================= */
function viewChef(){
  const tabs = [
    { id: 'orders',  label: '订单' },
    { id: 'menu',    label: '菜单' },
    { id: 'pantry',  label: '食材' },
    { id: 'pending', label: '待确认' }
  ];
  const segs = '<div class="segs">' + tabs.map(t =>
    '<div class="seg ' + (R.chefTab === t.id ? 'on' : '') + '" data-act="chefTab" data-tab="' + t.id + '">'
    + t.label + (t.id === 'pending' && S.pending.length ? ' ' + S.pending.length : '') + '</div>'
  ).join('') + '</div>';

  let body = '';
  if (R.chefTab === 'orders') body = chefOrders();
  else if (R.chefTab === 'menu') body = chefMenu();
  else if (R.chefTab === 'pantry') body = chefPantry();
  else body = chefPending();

  return '<div class="screen">' + topbar('厨房') + segs
    + '<div class="scroll" style="padding-top:2px">' + body + '</div>'
    + tabbar('chef') + '</div>';
}

function chefOrders(){
  const list = S.orders.filter(o => o.status !== 'done');
  if (!list.length) return '<div class="empty">' + tomatoSVG(64) + '<br>暂时没有新订单</div>';
  return list.map(o => {
    const d = dishById(o.dishId);
    const st = o.status === 'pending' ? '等待接单' : '制作中';
    return '<div class="rowcard">'
      + '<div class="rc-top"><div class="rc-name">' + esc(o.name) + '</div>'
      +   '<span class="tag ' + (o.status === 'pending' ? 'lack' : 'ok') + '">' + st + '</span></div>'
      + '<div class="rc-sub">' + fmtTime(o.at) + ' 下单</div>'
      + '<div class="rc-actions">'
      + (o.status === 'pending'
          ? '<span class="mini primary" data-act="accept" data-id="' + o.id + '">接单</span>'
          : '<span class="mini green" data-act="finish" data-id="' + o.id + '">做好了</span>')
      + '</div></div>';
  }).join('');
}

function chefMenu(){
  const groups = S.categories.map(c => {
    const items = S.dishes.filter(d => d.cat === c.id);
    if (!items.length) return '';
    return '<div style="margin-bottom:14px">'
      + '<div style="font-family:var(--hand);font-size:18px;margin:6px 0 8px">' + esc(c.name) + '</div>'
      + items.map(d => {
          const miss = missingOf(d);
          return '<div class="rowcard">'
            + '<div class="rc-top"><div class="rc-name">' + esc(d.name) + '</div>'
            +   '<span class="tag ' + (d.on ? 'ok' : 'off') + '">' + (d.on ? '在售' : '下架') + '</span></div>'
            + '<div class="rc-sub">' + esc(d.ing.join(' · '))
            +   (miss.length ? ' · <span style="color:var(--red2)">缺 ' + esc(miss.join('、')) + '</span>' : '')
            + '</div>'
            + '<div class="rc-actions">'
            +   '<span class="mini" data-act="toggleDish" data-id="' + d.id + '">' + (d.on ? '下架' : '上架') + '</span>'
            +   '<span class="mini" data-act="editDish" data-id="' + d.id + '">编辑</span>'
            +   '<span class="mini" data-act="delDish" data-id="' + d.id + '">删除</span>'
            + '</div></div>';
        }).join('')
      + '</div>';
  }).join('');

  return '<div class="btnrow" style="margin-bottom:14px">'
    + '<button class="btn" data-act="newDish">＋ 添加菜品</button>'
    + '<button class="btn ghost" data-act="newCat" style="max-width:36%">＋ 分类</button>'
    + '</div>' + groups;
}

function chefPantry(){
  const restock = S.restock.length
    ? '<div class="panel" style="border-color:var(--red2);box-shadow:3px 3px 0 rgba(181,52,31,.85)">'
      + '<h3>催进货 <span class="pin">置顶</span></h3>'
      + S.restock.map(n =>
          '<div class="rc-top" style="padding:6px 0">'
          + '<div class="rc-name" style="font-size:16px">' + esc(n) + '</div>'
          + '<span class="mini green" data-act="buied" data-id="' + n + '">已买到</span></div>'
        ).join('')
      + '</div>' : '';

  const ing = S.pantry.map(n =>
    '<span class="ing" data-act="delPantry" data-id="' + n + '">' + esc(n) + ' ×</span>'
  ).join('');

  return restock
    + '<div class="panel"><h3>现有食材（点一下删除）</h3><div class="ingrow">'
    + (ing || '<span style="color:var(--muted);font-size:12px">还没有食材</span>') + '</div></div>'
    + '<div class="panel"><h3>添加食材</h3>'
    + '<div class="airow"><input id="pantryInput" placeholder="例如：牛腩" />'
    + '<button class="aibtn" data-act="addPantry">加进去</button></div>'
    + '<div class="hint">只有食材齐的菜，吃货那边才能下单</div></div>'
    + '<div style="height:14px"></div>'
    + '<button class="btn ghost" data-act="reset" style="font-size:14px;padding:11px">清空演示数据</button>';
}

function chefPending(){
  if (!S.pending.length) return '<div class="empty">' + tomatoSVG(64) + '<br>没有待确认的菜谱</div>';
  return S.pending.map(p =>
    '<div class="rowcard">'
    + '<div class="rc-top"><div class="rc-name">' + esc(p.name) + '</div>'
    +   '<span class="tag">吃货投稿</span></div>'
    + '<div class="rc-sub">' + esc((p.ing || []).join(' · ')) + '</div>'
    + '<div class="rc-actions">'
    +   '<span class="mini primary" data-act="approve" data-id="' + p.id + '">加入菜单</span>'
    +   '<span class="mini" data-act="reject" data-id="' + p.id + '">驳回</span>'
    + '</div></div>'
  ).join('');
}

/* =========================================================
   11. 页面：添加 / 投稿
   ========================================================= */
function viewEdit(isMine){
  const editing = R.editId ? dishById(R.editId) : null;
  const src = editing || { name: '', cat: S.categories[0].id, ing: [], cost: 0, steps: [] };
  const catOpts = S.categories.map(c =>
    '<option value="' + c.id + '" ' + (src.cat === c.id ? 'selected' : '') + '>' + esc(c.name) + '</option>'
  ).join('');

  return '<div class="screen">'
    + topbar(editing ? '编辑菜品' : (isMine ? '添加菜品' : '投稿一道菜'), { back: true })
    + '<div class="scroll" style="padding-top:6px">'
    + '<div class="field"><label>菜名</label>'
    +   '<div class="airow"><input id="fName" placeholder="例如：番茄炒蛋" value="' + esc(src.name) + '" />'
    +   '<button class="aibtn" data-act="ai">AI 识别</button></div>'
    +   '<div class="hint" id="aiHint">输入菜名后点「AI 识别」，自动填好分类、食材、做法和成本</div>'
    + '</div>'
    + '<div class="field"><label>分类</label><select id="fCat">' + catOpts + '</select></div>'
    + '<div class="field"><label>食材（用顿号分隔）</label>'
    +   '<input id="fIng" placeholder="番茄、鸡蛋、葱" value="' + esc((src.ing || []).join('、')) + '" /></div>'
    + '<div class="field"><label>做法步骤（一行一步）</label>'
    +   '<textarea id="fSteps" placeholder="番茄切块&#10;鸡蛋打散&#10;热油下锅">' + esc((src.steps || []).join('\n')) + '</textarea></div>'
    + '<button class="btn" data-act="saveDish" data-mine="' + (isMine ? 1 : 0) + '">'
    +   (editing ? '保存修改' : (isMine ? '保存到菜单' : '提交给厨师确认')) + '</button>'
    + '<div style="height:8px"></div>'
    + '</div>'
    + tabbar(isMine ? 'chef' : 'home')
    + '</div>';
}

/* =========================================================
   12. 渲染
   ========================================================= */
function render(){
  let html = '';
  switch (R.screen){
    case 'cat':    html = viewCat(); break;
    case 'dish':   html = viewDish(); break;
    case 'record': html = viewRecord(); break;
    case 'chef':   html = viewChef(); break;
    case 'add':    html = viewEdit(true); break;
    case 'upload': html = viewEdit(false); break;
    default:       html = viewHome();
  }
  root.innerHTML = html;
  if (window.__pageIn){
    const sc = root.querySelector('.screen');
    if (sc) sc.classList.add('pagein');
  }
  window.__pageIn = false;
}

/* =========================================================
   12.5 壁纸 / 音乐 / 留言 / 凑一对
   ========================================================= */
const THEMES = ['', 'mint', 'peach', 'sky'];
const THEME_NAME = { '': '米黄纸', mint: '薄荷绿', peach: '蜜桃粉', sky: '雾蓝' };

function applyTheme(name){
  if (name) document.body.setAttribute('data-theme', name);
  else document.body.removeAttribute('data-theme');
  try { localStorage.setItem('tm_theme', name || ''); } catch(e){}
}

function cycleTheme(){
  const cur = document.body.getAttribute('data-theme') || '';
  const i = THEMES.indexOf(cur);
  const next = THEMES[(i + 1) % THEMES.length];
  applyTheme(next);
  sfx('tap');
  render();
  toast('壁纸：' + THEME_NAME[next]);
}

function toggleMusic(){
  initAudio();
  if (MUSIC.on){ musicStop(); toast('音乐关了'); }
  else { musicStart(); toast('音乐 · 很轻的一段'); }
  render();
}

/* 选择困难症救星：随机挑一道现在能做的菜 */
function pickLucky(){
  const pool = S.dishes.filter(function(d){
    return d.on && missingOf(d).length === 0;
  });
  if (!pool.length){
    sfx('warn');
    toast('现在没有能做的菜，先补点食材');
    return;
  }
  const d = pool[Math.floor(Math.random() * pool.length)];
  const art = TOM_IMG[d.cat]
    ? '<img class="luckyimg" src="' + TOM_IMG[d.cat] + '" alt="" />'
    : tomatoArt(321, { size: 116 });

  sfx('pop');
  modalEl.innerHTML = '<div class="box"><div class="lucky">'
    + '<div class="luckyart">' + art + '</div>'
    + '<div class="luckyname">' + esc(d.name) + '</div>'
    + '<div class="luckysub">' + esc(d.ing.join(' · ')) + '</div>'
    + '<div class="btnrow">'
    +   '<button class="btn ghost small" data-lucky="again">换一个</button>'
    +   '<button class="btn small" data-lucky="take">就它了</button>'
    + '</div></div></div>';
  modalEl.classList.add('show');
  modalEl.onclick = function(e){
    const a = e.target && e.target.getAttribute('data-lucky');
    if (a === 'again'){ pickLucky(); return; }
    if (a === 'take'){
      const artEl = modalEl.querySelector('.luckyart');
      modalEl.classList.remove('show');
      placeOrder(d, artEl, {});
      render();
    }
  };
}

function showLetter(){
  sfx('ok');
  modalEl.innerHTML = '<div class="box"><div class="letter">'
    + '<div class="ltitle">写给这间番茄房子</div>'
    + '<p>这间房子，是照着你画的那颗番茄盖的。</p>'
    + '<p>上面有你的梯子、你的猫，和一块写着「番茄炒雪糕」的招牌。<br/>我猜那是一道只有你们才会点的菜。</p>'
    + '<p>锅里有声音，门口有猫，走进去就有饭吃——<br/>这是我理解的、家的样子。</p>'
    + '<p>房子是你画的，程序是我写的。<br/>以后每次点开它，都算回家一趟。</p>'
    + '<div class="lsign">2026 年秋 · 一个帮你把房子搬进手机里的人</div>'
    + '<button class="btn ghost small" id="letterClose">收下</button>'
    + '</div></div>';
  modalEl.classList.add('show');
  modalEl.onclick = function(e){
    if (e.target && e.target.id === 'letterClose') modalEl.classList.remove('show');
  };
}

/* 长按一颗番茄 → 再点另一颗 → 凑成一颗心 */
let pickTimer = null;
let PICKED = null;

function pickTomato(row){
  if (PICKED) return;
  PICKED = { row: row, id: row.getAttribute('data-id') };
  row.classList.add('picked');
  // 吞掉「长按松手」那一下的 click，但 350ms 后必须放开，
  // 否则万一浏览器没派发那次 click，下一次点击就会被误吞
  window.__suppressClick = true;
  setTimeout(function(){ window.__suppressClick = false; }, 350);
  sfx('pop');
  toast('再点另一颗番茄试试');
}

function clearPick(){
  if (PICKED && PICKED.row) PICKED.row.classList.remove('picked');
  PICKED = null;
}

function heartArt(size){
  return '<svg viewBox="0 0 100 96" width="' + size + '" height="' + Math.round(size * 0.96) + '">'
    + '<path d="M50 86 C 10 58, 4 32, 21 20 C 34 11, 46 19, 50 29 C 54 19, 66 11, 79 20 C 96 32, 90 58, 50 86Z"'
    + ' fill="#DB4A2E" stroke="#241D17" stroke-width="3.4" stroke-linejoin="round"/></svg>';
}

function mergeTomatoes(a, b){
  const ta = a.querySelector('.vtom'), tb = b.querySelector('.vtom');
  if (!ta || !tb) { clearPick(); return; }
  const A = ta.getBoundingClientRect(), B = tb.getBoundingClientRect();
  const midX = (A.left + A.width / 2 + B.left + B.width / 2) / 2;
  const midY = (A.top + A.height / 2 + B.top + B.height / 2) / 2;

  [[ta, A], [tb, B]].forEach(function(pair){
    const el = pair[0], r = pair[1];
    const clone = document.createElement('div');
    clone.className = 'mergeclone';
    clone.innerHTML = el.innerHTML;
    clone.style.left = (r.left + r.width / 2 - 40) + 'px';
    clone.style.top = (r.top + r.height / 2 - 40) + 'px';
    document.body.appendChild(clone);
    requestAnimationFrame(function(){
      clone.style.transform = 'translate(' + (midX - (r.left + r.width / 2)) + 'px,'
        + (midY - (r.top + r.height / 2)) + 'px) scale(.5)';
      clone.style.opacity = '0.15';
    });
    setTimeout(function(){ clone.remove(); }, 430);
  });

  const heart = document.createElement('div');
  heart.className = 'heartpop';
  heart.innerHTML = heartArt(96);
  heart.style.left = (midX - 48) + 'px';
  heart.style.top = (midY - 48) + 'px';

  sfx('love');
  clearPick();
  S.merges = (S.merges || 0) + 1;
  save();
  const n = S.merges;
  toast(n === 1 ? '第一颗 ❤' : '第 ' + n + ' 颗 ❤');
}

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function modal(title, body, okText, onOk){
  modalEl.innerHTML = '<div class="box"><h4>' + esc(title) + '</h4><div class="modalbody">' + body + '</div>'
    + '<div class="btnrow"><button class="btn ghost small" data-m="cancel">算了</button>'
    + '<button class="btn small" data-m="ok">' + esc(okText) + '</button></div></div>';
  modalEl.classList.add('show');
  modalEl.onclick = e => {

/* 下单后，番茄一路飞进「厨房」 ---------- */
function flyToKitchen(fromEl){
  if (!fromEl || !fromEl.getBoundingClientRect) return;
  const tab = document.querySelector('.tabbar .tab:nth-child(3)');
  if (!tab) return;
  const a = fromEl.getBoundingClientRect();
  const b = tab.getBoundingClientRect();
  const S0 = 34;
  const x0 = a.left + a.width / 2 - S0 / 2;
  const y0 = a.top + a.height / 2 - S0 / 2;
  const x1 = b.left + b.width / 2 - S0 / 2;
  const y1 = b.top - 6;

  const el = document.createElement('div');
  el.className = 'flytom';
  el.style.left = x0 + 'px';
  el.style.top = y0 + 'px';
  el.innerHTML = tomatoArt((Math.random() * 9999) | 0, { size: S0 });
  document.body.appendChild(el);

  const dur = 640;
  const t0 = performance.now();
  const cx = (x0 + x1) / 2;
  const cy = Math.min(y0, y1) - 130;

  function step(now){
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 2);
    const x = (1 - e) * (1 - e) * x0 + 2 * (1 - e) * e * cx + e * e * x1;
    const y = (1 - e) * (1 - e) * y0 + 2 * (1 - e) * e * cy + e * e * y1;
    el.style.transform = 'translate(' + (x - x0) + 'px,' + (y - y0) + 'px) scale(' + (1 - 0.4 * e) + ')';
    el.style.opacity = String(1 - 0.2 * e);
    if (k < 1) requestAnimationFrame(step);
    else {
      el.remove();
      tab.classList.add('bump-tab');
      setTimeout(function(){ tab.classList.remove('bump-tab'); }, 500);
    }
  }
  requestAnimationFrame(step);
}

function flyTomato(x, y){
  const el = document.createElement('div');
  el.className = 'fly';
  el.textContent = '🍅';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  app.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

root.addEventListener('click', e => {

    const row = el && el.closest ? el.closest('.vrow') : null;
    if (row && row !== PICKED.row){ mergeTomatoes(PICKED.row, row); return; }

    case 'theme':
      cycleTheme();

    case 'music':
      toggleMusic();
      return;
    case 'letter':

      return;
    case 'lucky':
      pickLucky();

      else if (tab === 'chef') go('chef', { chefTab: R.chefTab || 'orders' });
      else go('home');
      return;
    }
    case 'switchRole':
      sfx('pop');
      S.role = S.role === 'chef' ? 'eater' : 'chef';
      save();
      go(S.role === 'chef' ? 'chef' : 'home', { chefTab: 'orders' });
      toast(S.role === 'chef' ? '现在是厨师' : '现在是吃货');
      return;
    case 'back':
      sfx('tap');
      if (R.screen === 'add' || R.screen === 'upload') go('chef', { chefTab: 'menu' });
      else if (R.screen === 'dish') go('cat', { cat: (dishById(R.dish) || {}).cat });
      else if (R.screen === 'cat') go('home');
      else go('home');
      return;
    case 'openCat':
      sfx('tap');
      bumpEl(el.querySelector('.vtom'));
      setTimeout(function(){ go('cat', { cat: id }); }, 160);
      return;
    case 'openDish':
      bumpEl(el);
      setTimeout(function(){ showDishPop(id, el); }, 120);
      return;
    case 'pokeTomato':
      sfx('tap');
      bumpEl(el);
      return;
    case 'pokeCat':
      sfx('meow');
      el.querySelector('svg').classList.remove('hop');
      void el.offsetWidth;
      el.querySelector('svg').classList.add('hop');
      return;
    case 'order':
    case 'quickOrder':
      placeOrder(dishById(id), el, {});
      return;
    case 'orderHere':
      bumpEl(el.parentNode && el.parentNode.querySelector('.mart'));
      placeOrder(dishById(id), el, { stay: true });
      return;
    case 'upload':
      sfx('tap'); R.editId = null; go('upload'); return;
    case 'newCat': {
      modal('新建分类',
        '<div class="field" style="margin:0 0 8px"><input id="catName" placeholder="分类名，例如：凉拌" /></div>'
        + '<div class="field" style="margin:0"><input id="catSub" placeholder="一句话说明（可空）" /></div>',
        '建好了', () => {
          const nm = ($('#catName').value || '').trim();
          if (!nm) return;
          S.categories.push({ id: 'c' + uid(), name: nm, sub: ($('#catSub').value || '').trim() });
          save(); render(); toast('分类已加');
        });
      return;
    }
    case 'restock': {
      const d = dishById(id);
      const miss = missingOf(d);
      miss.forEach(n => { if (S.restock.indexOf(n) === -1) S.restock.push(n); });
      save(); sfx('ok');
      toast('已催：' + miss.join('、'));
      if (R.screen === 'dish' || R.screen === 'cat') render();
      else render();
      return;
    }
    case 'chefTab':
      sfx('tap'); R.chefTab = el.getAttribute('data-tab'); render(); return;
    case 'accept': {
      const o = S.orders.find(x => x.id === id);
      if (o){ o.status = 'cooking'; save(); sfx('ok'); toast('接单了，开始做'); render(); }
      return;
    }
    case 'finish': {
      const o = S.orders.find(x => x.id === id);
      if (o){ o.status = 'done'; save(); sfx('ok'); toast('完成 · 吃货可以吃了'); render(); }
      return;
    }
    case 'toggleDish': {
      const d = dishById(id);
      if (d){ d.on = !d.on; save(); sfx('tap'); render(); }
      return;
    }
    case 'editDish':
      sfx('tap'); R.editId = id; go('add'); return;
    case 'delDish':
      sfx('warn');
      modal('删掉这道菜？', '删了就得重新添加。', '删掉', () => {
        tombstone(id);
        S.dishes = S.dishes.filter(x => x.id !== id);
        save(); render(); toast('已删除');
      });
      return;
    case 'newDish':
      sfx('tap'); R.editId = null; go('add'); return;
    case 'ai':
      aiFill();
      return;
    case 'saveDish':
      saveDish(el.getAttribute('data-mine') === '1');
      return;
    case 'addPantry': {
      const inp = $('#pantryInput');
      const v = (inp.value || '').trim();
      if (!v){ toast('先写个食材名'); return; }
      if (S.pantry.indexOf(v) === -1) S.pantry.push(v);
      S.restock = S.restock.filter(x => x !== v);
      save(); sfx('ok'); toast('已加入食材库'); render();
      return;
    }
    case 'delPantry': {
      S.pantry = S.pantry.filter(x => x !== id);
      save(); sfx('tap'); render(); return;
    }
    case 'buied': {
      S.restock = S.restock.filter(x => x !== id);
      if (S.pantry.indexOf(id) === -1) S.pantry.push(id);
      save(); sfx('ok'); toast('已补货：' + id); render(); return;
    }
    case 'approve': {
      const p = S.pending.find(x => x.id === id);
      if (p){
        S.dishes.push({ id: uid(), cat: p.cat, name: p.name, ing: p.ing, steps: p.steps, cost: p.cost, on: true });
        tombstone(id);
        S.pending = S.pending.filter(x => x.id !== id);
        save(); sfx('ok'); toast('已加入菜单'); render();
      }
      return;
    }
    case 'reset': {
      modal('清空数据？', '菜单、订单、食材都会回到初始状态，两个人那边一起清空。', '清空', () => {
        S = seed();
        saveLocal();
        R.screen = 'home';
        render();
        if (SYNC.on){
          api('api/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ state: S })
          }).then(d => { SYNC.rev = d.rev; }).catch(() => {});
        }
        toast('已重置');
      });
      return;
    }
    case 'reject': {
      tombstone(id);
      S.pending = S.pending.filter(x => x.id !== id);
      save(); sfx('warn'); toast('已驳回'); render(); return;
    }
  }
});

/* ---------- AI 识别（本地规则模拟，正式版换成大模型接口） ---------- */
function aiFill(){
  const nameEl = $('#fName');
  const name = (nameEl.value || '').trim();
  if (!name){ toast('先写个菜名'); sfx('warn'); return; }

  const known = { '番茄炒蛋': 'chao', '番茄炒鸡蛋': 'chao', '西红柿炒蛋': 'chao' };
  let cat = known[name] || null;
  if (!cat){
    const probe = (t) => name.indexOf(t) >= 0;
    if (probe('炒')) cat = 'chao';
    else if (probe('炸')) cat = 'zha';
    else if (probe('汤') || probe('炖')) cat = 'tang';
    else if (probe('煮') || probe('面')) cat = 'zhu';
    else if (probe('烤')) cat = 'kao';
    else if (probe('蒸')) cat = 'zheng';
    else cat = 'chao';
  }

  const ing = [];
  ING_MAP.forEach(([k, v]) => { if (name.indexOf(k) >= 0 && ing.indexOf(v) === -1) ing.push(v); });
  if (!ing.length) ing.push('盐');
  if (ing.length < 2) ing.push('葱');
  if (ing.indexOf('油') === -1) ing.push('油');

  const cost = Math.max(6, 4 + ing.length * 4);
  const steps = RECIPE_STEPS[cat] || [];

  $('#fCat').value = cat;
  $('#fIng').value = ing.join('、');
  $('#fSteps').value = steps.join('\n');
  const hint = $('#aiHint');
  if (hint) hint.innerHTML = '已识别：分类「' + catById(cat).name + '」· 食材 ' + ing.length + ' 项 · 步骤已填好（都可以改）';
  sfx('ok');
}

function saveDish(isMine){
  const name = ($('#fName').value || '').trim();
  if (!name){ toast('菜名不能空'); sfx('warn'); return; }
  const cat = $('#fCat').value;
  const ing = ($('#fIng').value || '').split(/[、,，\s]+/).filter(Boolean);
  const cur = R.editId ? dishById(R.editId) : null;
  const cost = cur ? cur.cost : 0;
  const steps = ($('#fSteps').value || '').split('\n').map(s => s.trim()).filter(Boolean);

  if (R.editId && isMine){
    const d = dishById(R.editId);
    if (d){ d.name = name; d.cat = cat; d.ing = ing; d.cost = cost; d.steps = steps; }
    save(); sfx('ok'); toast('已保存'); R.editId = null; go('chef', { chefTab: 'menu' });
    return;
  }

  if (isMine){
    S.dishes.push({ id: uid(), cat, name, ing, cost, steps, on: true });
    save(); sfx('ok'); toast('已加入菜单'); go('chef', { chefTab: 'menu' });
  } else {
    S.pending.push({ id: uid(), cat, name, ing, cost, steps });
    save(); sfx('ok'); toast('已提交，等厨师确认'); go('home');
  }
}

(function dragInit(){
  const wrap = $('#dragTom');
  let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
  wrap.addEventListener('pointerdown', e => {
    dragging = true; sx = e.clientX; sy = e.clientY; ox = 0; oy = 0;
    wrap.setPointerCapture(e.pointerId);
    initAudio();
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging) return;
    ox = e.clientX - sx; oy = e.clientY - sy;
    wrap.style.transform = 'translate(' + ox + 'px,' + oy + 'px)';
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    wrap.style.transition = 'transform .35s cubic-bezier(.34,1.56,.64,1)';
    wrap.style.transform = 'translate(0,0)';
    setTimeout(() => { wrap.style.transition = 'none'; }, 360);
  };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
})();

function boot(){
  try { applyTheme(localStorage.getItem('tm_theme') || ''); } catch(e){}

  const slow = setTimeout(function(){
    const el = $('#loadMsg');
    const sub = $('#loadSub');
    if (el) el.textContent = '网络不太好…';
    if (sub) sub.textContent = '先把番茄摘下来，稍等一下';
  }, 2600);

  initSync().then(synced => {
    clearTimeout(slow);
    if (!synced){
      S = loadLocal() || seed();
      if (!S.restock) S.restock = [];
      if (!S.pending) S.pending = [];
      if (!S.tombstones) S.tombstones = [];
    }
    render();

    setTimeout(() => {
      const el = $('#load');
      if (el) el.classList.add('gone');
      sfx('pop');
    }, 700);

    if (synced){
      SYNC.pollT = setInterval(poll, 1500);
      const el = $('#loadSub');
      if (el) el.textContent = '已和对方连上';
    } else {
      const el = $('#loadSub');
      if (el) el.textContent = '没连上，先用本地的';
    }
  });
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    Promise.reject(new Error('standalone')).catch(function(){});
  });
}

boot();

})();
</script>
